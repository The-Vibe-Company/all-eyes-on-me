<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<style>
  body { margin: 0; font-family: Verdana, sans-serif; background: #fffbe6; }
  h1 { margin: 0; padding: 12px; background: teal; color: #fff; font-size: 22px; }
  form { margin: 30px; display: grid; gap: 6px; width: 260px; }
  label { font-size: 11px; color: #999; }
  .erreur { margin: 30px 30px 0; color: #f66; font-size: 12px; }
</style>
</head>
<body>
<h1>Connexion à la boutique</h1>
<!-- include: erreur -->
<form method="post" action="/connexion">
  <label for="email">Email</label>
  <input id="email" name="email" type="email">
  <label for="mdp">Mot de passe</label>
  <input id="mdp" name="mdp" type="password">
  <button>Se connecter</button>
</form>
</body>
</html>
