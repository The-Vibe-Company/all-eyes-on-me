<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact</title>
<style>
  body { margin: 0; font-family: "Courier New", monospace; background: #111; color: #ddd; }
  .bar { padding: 24px; background: #333; text-align: right; }
  .bar span { font-size: 28px; float: left; color: orange; }
  .bar a { color: #aaa; margin-left: 20px; }
  form { max-width: 420px; margin: 40px auto; display: grid; gap: 10px; }
  input, textarea { background: #222; color: #ddd; border: 1px solid #555; padding: 8px; }
  .send { background: orange; color: black; text-align: center; padding: 10px; cursor: default; }
</style>
</head>
<body>
<div class="bar"><span>~ super boutique ~</span><a href="/">ACCUEIL</a><a href="/aide">AIDE</a></div>
<form onsubmit="return false">
  <label for="email">Email</label>
  <input id="email" type="email">
  <label for="msg">Message</label>
  <textarea id="msg" rows="5"></textarea>
  <div class="send" onclick="alert('Envoyé')">ENVOYER</div>
</form>
</body>
</html>
